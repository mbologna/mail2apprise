[project]
name = "mail2apprise"
version = "1.0.0"
description = "Postfix pipe transport that turns a mail into an Apprise notification"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.12.12"
exclude-newer = "7 days"

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-cov>=7.1.0", "ruff>=0.8.0"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["mail2apprise"]
