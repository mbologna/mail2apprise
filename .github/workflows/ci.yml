name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@2dfb93f9e6322edae933aba674b6b265797ea2cd # main
    with:
      python_version: "3.10"
      use_uv: true
      enable_codecov: false
    secrets: inherit

  cache-cleanup:
    if: github.event_name == 'schedule'
    uses: mbologna/.github/.github/workflows/cache-cleanup.yml@2dfb93f9e6322edae933aba674b6b265797ea2cd # main
    with:
      max_age_days: 7
    permissions:
      actions: write
