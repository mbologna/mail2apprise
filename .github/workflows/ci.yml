name: CI

"on":
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # ruff, the tests with the coverage gate (fail_under in pyproject.toml)
  # and pip-audit on the locked runtime dependencies.
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@52b335cb95b89c4084d3914b07fbceadc9a4e322 # main
    with:
      python_version: "3.15"
      enable_codecov: false
    secrets: inherit

  # Releases: Monday's schedule tags vX.Y.Z with a GitHub Release of the
  # commit subjects when a feat, fix, perf, revert or breaking commit
  # landed (or a maintenance release for dependency updates), and a push to
  # main tags only a fix(security) commit. A tag builds nothing.
  auto-release:
    needs: [python]
    # contents: push the tag and create the Release.
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@ce1db2ef60f24345ab930d7434672fcd99556804 # main
    with:
      strategy: conventional
      dispatch_tag_build: false
    secrets: inherit
