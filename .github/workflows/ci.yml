name: CI

"on":
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on the default branch: it may be releasing, and a cut
  # release leaves a tag without its Release.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  python:
    uses: mbologna/.github/.github/workflows/python-ci.yml@5797c3f0e987ee045b00d0a1640dfcdce3c45ce0 # main
    with:
      python_version: "3.10"
      enable_codecov: false
    secrets: inherit

  auto-release:
    needs: [python]
    # contents: push the tag and create the Release.
    permissions:
      contents: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@5797c3f0e987ee045b00d0a1640dfcdce3c45ce0 # main
    with:
      strategy: conventional
      dispatch_tag_build: false
    secrets: inherit
